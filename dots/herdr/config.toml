onboarding = false
# [theme]
# name = "one-dark"

[terminal]
default_shell="zsh"

# Recolored to the Kanagawa Dragon palette
[theme.custom]
accent = "#C4B28A"      # dragonGreen
panel_bg = "#181616"    # dragonBlack3, main background
surface0 = "#282727"    # dragonBlack4
surface1 = "#393836"    # dragonBlack5
surface_dim = "#1D1C19" # dragonBlack2
overlay0 = "#7a8382"    # dragonGray3
overlay1 = "#9e9b93"    # dragonGray2
text = "#c5c9c5"        # dragonWhite
subtext0 = "#a6a69c"    # dragonGray
mauve = "#a292a3"       # dragonPink
green = "#87a987"       # dragonGreen
yellow = "#c4b28a"      # dragonYellow
red = "#c4746e"         # dragonRed
blue = "#8ea4a2"        # dragonAqua
teal = "#87a987"        # dragonGreen
peach = "#b6927b"       # dragonOrange

# show_agent_labels_on_pane_borders = true

[keys]

prefix = "ctrl+a"
# PANES
split_vertical = "alt+n"
split_horizontal = "alt+m"
zoom = "alt+f"
close_pane = "alt+q"
# Focus Pane
focus_pane_right = "ctrl+l"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"

# TABS
new_tab = "alt+t"
rename_tab = "prefix+t"
switch_tab = "alt+1..9"
previous_tab = ""
last_pane = "prefix+p"
close_tab = "prefix+x"

# WORKSPACES
# switch_workspace = "prefix+shift+1..9"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
close_workspace = "prefix+shift+x"

# open_worktree = "prefix+shift+o"
# next_workspace = "prefix+shift+right"

# Move between agents in the sidebar.
# Avoid Herdr's built-in prefix+shift+j/k pane-swap bindings.
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# Jump straight to agent N (1..9) as listed in the sidebar.
# Use Ctrl after the prefix: Alt+number is owned by skhd/yabai spaces,
# and Shift+number did not reach Herdr reliably in the current terminal setup.
focus_agent = "prefix+ctrl+1..9"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "gitui"
description = "run gitui"

[[keys.command]]
key = "prefix+alt+e"
type = "pane"
command = "~/.config/herdr/scripts/yazi-workspace.sh"
description = "open project with yazi"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[experimental]
pane_history = false

[ui.sound]
enabled = true
